[package]
name = "inkdown"
version = "0.9.0"
edition = "2021"
description = "Inkdown - Markdown viewer and editor"
build = "build.rs"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
comrak = { version = "1.0.0-rc.1", default-features = false, features = ["shortcodes"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
rfd = "0.18"
notify = "8"
rust-embed = "8"
mime_guess = "2"
base64 = "0.22"
percent-encoding = "2"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
getrandom = "0.3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
