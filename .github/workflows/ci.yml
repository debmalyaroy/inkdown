name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          # the oldest Ubuntu still supported, like the release: what is built here runs on newer ones
          - { name: Linux, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libxcb1-dev libgl1-mesa-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Unit tests
        working-directory: native
        run: cargo test --locked
      - name: Build the application
        working-directory: native
        run: cargo build --locked
      # the Linux build, for the UI checks below and for testing by hand
      # macOS: the same scripted UI checks that test the Windows build, on the runner's own display
      - name: UI checks (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 -m pip install --quiet --user --break-system-packages pillow || python3 -m pip install --quiet --user pillow
          pwsh -NoProfile -File native/tools/uitest.ps1 -Exe native/target/debug/inkdown -Out "$RUNNER_TEMP/uitest"
      - name: Keep the macOS screenshots and state dumps
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-uitest-output
          path: |
            ${{ runner.temp }}/uitest/*.png
            ${{ runner.temp }}/uitest/*.json
            ${{ runner.temp }}/uitest/*.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: Strip the Linux build
        if: runner.os == 'Linux'
        run: strip --strip-debug native/target/debug/inkdown
      - name: Keep the Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: inkdown-linux
          path: native/target/debug/inkdown
          retention-days: 14

  linux-ui:
    name: UI checks (Linux, in a container)
    needs: test
    # runs whenever the Linux build exists, whatever the other systems did
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: inkdown-linux
          path: dist/linux
      - name: Build the test container
        run: docker build -t inkdown-linux-uitest packaging/linux/uitest
      - name: Run the UI checks on a virtual display
        run: |
          mkdir -p dist/linux-uitest
          docker run --rm --shm-size=512m -v "$PWD:/src:ro" -v "$PWD/dist/linux:/app:ro" -v "$PWD/dist/linux-uitest:/out" inkdown-linux-uitest
      - name: Keep the Linux screenshots and state dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-uitest-output
          path: dist/linux-uitest
          retention-days: 7

  android-check:
    name: Type-check (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: cargo check
        working-directory: native
        run: cargo check --lib --locked --target aarch64-linux-android

  android-apk:
    name: Android APK (package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # without the secrets (a fork, for example) the build uses its test key
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ]; then
            mkdir -p "$RUNNER_TEMP/sign"
            printf %s "$KEYSTORE" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/sign/keystore"
            printf %s "$PASSWORD" | tr -d '[:space:]' > "$RUNNER_TEMP/sign/password"
            echo "SIGN_ARGS=--secret id=android_keystore,src=$RUNNER_TEMP/sign/keystore --secret id=android_keystore_password,src=$RUNNER_TEMP/sign/password" >> "$GITHUB_ENV"
          fi
      - name: Build APK (Docker)
        run: docker build $SIGN_ARGS -f packaging/android/Dockerfile -t inkdown-android .
      - name: Copy APK out of the image
        run: |
          mkdir -p dist/android
          docker run --rm -v "$PWD/dist/android:/out" inkdown-android
      - uses: actions/upload-artifact@v4
        with:
          name: inkdown-android-apk
          path: dist/android/inkdown.apk
          if-no-files-found: error
          retention-days: 14
