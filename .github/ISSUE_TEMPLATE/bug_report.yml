name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. For security problems, use the Security tab instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a file with ...
        2. Switch to Write mode
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Inkdown version
      description: Menu > Help > About Inkdown
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows (installer)
        - Windows (portable exe)
        - Android
        - macOS
        - Linux
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system version
      placeholder: Windows 11 24H2, Android 15 on Pixel 8, macOS 15.1 on M2 ...
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or a sample file
      description: Drag files here. Remove anything private from a document before attaching it.
