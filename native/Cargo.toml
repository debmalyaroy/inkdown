[package]
name = "inkdown-native"
version = "1.0.0"
edition = "2021"
description = "Inkdown: a universal editor with a pure-Rust UI and renderer (no web view)"

[lib]
name = "inkdown_native"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "inkdown"
path = "src/main.rs"

[features]
default = ["glow"]
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui = { version = "0.37", default-features = false }
ropey = "1.6"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load", "yaml-load", "plist-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
comrak = { version = "1.0.0-rc.1", default-features = false, features = ["shortcodes"] }
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
mermaid-rs-renderer = { version = "0.3", default-features = false }
layout-rs = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
serde = { version = "1", features = ["derive"] }
encoding_rs = "0.8"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = "0.22"
latex-rust = "=2.1.1"
# Avro data files: block codecs
flate2 = "1"
snap = "1"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "clipboard", "links", "wayland", "x11"] }
rfd = "0.18"
notify = "8"
ignore = "0.4"
ureq = { version = "3", features = ["json"] }
arboard = { version = "3", default-features = false }
sha2 = "0.10"
getrandom = "0.3"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Storage_Packaging_Appx", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Android packaging: see ../packaging/android/Dockerfile (cargo-apk).
[package.metadata.android]
package = "app.inkdown.editor"
apk_name = "inkdown"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "../packaging/android/res"
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Inkdown"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
label = "Inkdown"
launch_mode = "singleTask"
orientation = "unspecified"
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|uiMode|density"

# "Open with Inkdown" for text documents from a file manager or another app
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.EDIT"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]
data = [
    { scheme = "content", mime_type = "text/*" },
    { scheme = "file", mime_type = "text/*" },
    { scheme = "content", mime_type = "application/json" },
    { scheme = "content", mime_type = "application/x-yaml" },
    { scheme = "content", mime_type = "application/toml" },
    { scheme = "content", mime_type = "image/svg+xml" },
]